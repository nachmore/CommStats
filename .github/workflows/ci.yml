name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  # Auto-publish a nightly release on every green push to main. Dispatches
  # release.yml with channel=nightly, pinned to the exact CI-verified SHA.
  auto-release-nightly:
    name: Auto-publish nightly
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch release.yml with channel=nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Dispatching release.yml for channel=nightly at ${BUILD_SHA}"
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f channel=nightly \
            -f head_sha="${BUILD_SHA}"
